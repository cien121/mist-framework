name: Build Mist Framework AAR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - name: Go vet and test
        run: |
          cd core
          go vet ./...
          go test ./...
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
      - name: Build AAR with gomobile
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865
          gomobile bind -target=android/arm64 -androidapi 24 -trimpath -o mistframework.aar github.com/cien121/mist-framework/core
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: mistframework-aar
          path: mistframework.aar
          retention-days: 7
